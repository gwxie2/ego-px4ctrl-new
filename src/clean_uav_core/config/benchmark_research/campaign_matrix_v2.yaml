output_root: benchmark_artifacts/research_profiles
default_repetitions: 1
wait_for_session_complete: true
cleanup_before_each_run: true
default_runtime_overrides:
  gui: false
  use_rviz: false
  enable_oscillation: false
  benchmark_enable: true

phases:
  - id: stage_a
    title: Speed Ramping Baseline
    description: V2 主线速度梯度压力测试，同时保留 V1 参考基线。
    cases:
      - name: v2_speed_1p2
        version: v2
        swarm_config: src/clean_uav_core/config/benchmark_research/stage_a_speed_ramping_v2.yaml
        profile: speed_1p2
        launch_output: src/clean_uav_core/launch/benchmark_stage_a_v2_speed_1p2.launch
        launch_file: benchmark_stage_a_v2_speed_1p2.launch
        label: stage_a_v2_speed_1p2
        runtime_overrides:
          benchmark_default_vmax: 1.2
          swarm_clearance: 0.35
      - name: v2_speed_3p0
        version: v2
        swarm_config: src/clean_uav_core/config/benchmark_research/stage_a_speed_ramping_v2.yaml
        profile: speed_3p0
        launch_output: src/clean_uav_core/launch/benchmark_stage_a_v2_speed_3p0.launch
        launch_file: benchmark_stage_a_v2_speed_3p0.launch

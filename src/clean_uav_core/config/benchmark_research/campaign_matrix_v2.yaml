        launch_file: benchmark_stage_a_v2_speed_5p0.launch
        label: stage_a_v2_speed_5p0
        runtime_overrides:
          benchmark_default_vmax: 5.0
      - name: v2_speed_7p0
        version: v2
        swarm_config: src/clean_uav_core/config/benchmark_research/stage_a_speed_ramping_v2.yaml
        profile: speed_7p0
        launch_output: src/clean_uav_core/launch/benchmark_stage_a_v2_speed_7p0.launch
        launch_file: benchmark_stage_a_v2_speed_7p0.launch
        label: stage_a_v2_speed_7p0
        runtime_overrides:
          benchmark_default_vmax: 7.0
      - name: v2_speed_10p0

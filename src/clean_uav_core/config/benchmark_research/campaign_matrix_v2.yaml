  - id: stage_e
    title: Sensor Degradation Comparison
    description: 5m/s 与 10m/s 下 clean/mild/extreme 对照，用于评估感知退化对规划与控制的影响。
    cases:
      - name: e_5p0_clean
        version: v2
        swarm_config: src/clean_uav_core/config/benchmark_research/stage_c_time_smooth_tradeoff_v2.yaml
        profile: smooth_priority
        launch_output: src/clean_uav_core/launch/benchmark_stage_e_5p0_clean.launch
        launch_file: benchmark_stage_e_5p0_clean.launch
        label: stage_e_5p0_clean
        runtime_overrides:
          benchmark_default_vmax: 5.0
          planner_start_z_threshold: 0.2
          planner_start_stable_duration: 0.8
          sensor_degradation_enabled: false
          sensor_degradation_mode: clean
      - name: e_5p0_nominal
        version: v2
        swarm_config: src/clean_uav_core/config/benchmark_research/stage_c_time_smooth_tradeoff_v2.yaml
        profile: smooth_priority
        launch_output: src/clean_uav_core/launch/benchmark_stage_e_5p0_nominal.launch
        launch_file: benchmark_stage_e_5p0_nominal.launch
        label: stage_e_5p0_nominal
        runtime_overrides:
          benchmark_default_vmax: 5.0
          planner_start_z_threshold: 0.2
          planner_start_stable_duration: 0.8
          sensor_degradation_enabled: true
          sensor_degradation_mode: nominal
      - name: e_5p0_mild_no_latency
        version: v2
        swarm_config: src/clean_uav_core/config/benchmark_research/stage_c_time_smooth_tradeoff_v2.yaml
        profile: smooth_priority
